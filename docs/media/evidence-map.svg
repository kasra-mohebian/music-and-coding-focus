   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17373d" x="40.32" y="49.68" transform="rotate(-0 40.32 49.68)">What the evidence can support</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="40.32" y="77.76" transform="rotate(-0 40.32 77.76)">An access and interpretation map of 18 references · not 18 independent coding experiments</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="64.8" y="150.457422" transform="rotate(-0 64.8 150.457422)">12</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17373d" x="87.12" y="151.92" transform="rotate(-0 87.12 151.92)">Full text checked</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="59.04" y="185.04" transform="rotate(-0 59.04 185.04)">Primary methods/results reviewed</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="59.04" y="205.92" transform="rotate(-0 59.04 205.92)">Record-level limitations retained</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="354.24" y="150.457422" transform="rotate(-0 354.24 150.457422)">4</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17373d" x="376.56" y="151.92" transform="rotate(-0 376.56 151.92)">Abstract-level checks</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="348.48" y="185.04" transform="rotate(-0 348.48 185.04)">Abstract, or abstract + author slides</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="348.48" y="205.92" transform="rotate(-0 348.48 205.92)">Conclusions remain qualified</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="643.68" y="150.457422" transform="rotate(-0 643.68 150.457422)">2</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17373d" x="666" y="151.92" transform="rotate(-0 666 151.92)">Identity verified only</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="637.92" y="185.04" transform="rotate(-0 637.92 185.04)">Bibliographic information confirmed</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="637.92" y="205.92" transform="rotate(-0 637.92 205.92)">No full-text outcome claim</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="64.8" y="324.697422" transform="rotate(-0 64.8 324.697422)">A</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17373d" x="87.12" y="326.16" transform="rotate(-0 87.12 326.16)">Keep outcomes separate</text>
   </g>
   <g id="text_17">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="59.04" y="359.28" transform="rotate(-0 59.04 359.28)">Perceived focus and mood</text>
   </g>
   <g id="text_18">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="59.04" y="380.16" transform="rotate(-0 59.04 380.16)">Speed, accuracy and code quality</text>
   </g>
   <g id="text_19">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="59.04" y="401.04" transform="rotate(-0 59.04 401.04)">Feeling better ≠ proven performance gain</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="501.12" y="324.697422" transform="rotate(-0 501.12 324.697422)">B</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17373d" x="523.44" y="326.16" transform="rotate(-0 523.44 326.16)">Check independent evidence</text>
   </g>
   <g id="text_22">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="495.36" y="359.28" transform="rotate(-0 495.36 359.28)">M11 / M12 share a dataset</text>
   </g>
   <g id="text_23">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="495.36" y="380.16" transform="rotate(-0 495.36 380.16)">M10 extends M09 and adds evaluations</text>
   </g>
   <g id="text_24">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="495.36" y="401.04" transform="rotate(-0 495.36 401.04)">Do not count related work as replication</text>
   </g>
   <g id="text_25">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14545a" x="40.32" y="493.2" transform="rotate(-0 40.32 493.2)">Six records need deeper access; the review does not claim a pooled effect or universal music prescription.</text>
   </g>
  </g>
